name: Deploy mitenya

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# main'e push -> kaynagi sunucuya rsync -> orada `docker compose up -d --build`.
# Sunucudaki .env korunur (rsync haric tutar). Gerekli Secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH anahtarini hazirla
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Kaynagi sunucuya rsync
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='.env.*' \
            --exclude='node_modules' --exclude='.next' --exclude='coverage' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/mitenya/"

      - name: Build & restart (sunucuda)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /srv/mitenya && docker compose up -d --build && docker image prune -f"

name: Deploy mitenya

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Sunucuya SSH ile bağlanıp git pull + rebuild yapar (panelsiz otomatik deploy).
# Gerekli GitHub Secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /srv/mitenya
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
